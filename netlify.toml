[build]
  command = "npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify serves .webmanifest as octet-stream, which stops browsers from
# treating it as an installable web app manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# API requests go to the serverless function. This rule must stay above the
# SPA fallback, otherwise /api/* would be answered with index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
